version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy_user} -d pharmacy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ── Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmacy_user}:${POSTGRES_PASSWORD}@db:5432/pharmacy?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      FRONTEND_URL: ${FRONTEND_URL:?required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      EMAIL_OTP_EXP_MIN: ${EMAIL_OTP_EXP_MIN:-10}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      EMAIL_OTP_RESEND_COOLDOWN_SEC: ${EMAIL_OTP_RESEND_COOLDOWN_SEC:-60}
      RESET_CODE_TTL_MINUTES: ${RESET_CODE_TTL_MINUTES:-10}
      RESET_CODE_PEPPER: ${RESET_CODE_PEPPER:?required}
      RESET_TOKEN_SECRET: ${RESET_TOKEN_SECRET:?required}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - app_network

  # ── Frontend (Nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_network

volumes:
  pg_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
